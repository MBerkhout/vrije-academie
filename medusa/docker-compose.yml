# Local development: Redis + OpenSearch for Medusa search.
# Postgres is started separately via ./start-db.sh (container name: medusa-postgres).
#
# Usage:
#   ./start-db.sh          # Postgres (if not already running)
#   docker compose up -d   # Redis + OpenSearch

services:
  redis:
    image: redis:7-alpine
    # No fixed container_name — avoids conflict with an existing medusa-redis from older setups.
    ports:
      - "6379:6379"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: medusa-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=LocalDevOnly1!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - medusa_opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

volumes:
  medusa_opensearch_data:
